<!DOCTYPE html>
<html>
    <head>
        <title>kiwi.rocks</title>
        <link rel="icon" id="favicon" type="image/x-icon" href="images/favicon.ico">
        <link rel="stylesheet" id="css" href="styles/intro.css">
        <script src="scripts/intro.js" defer></script>
        <meta charset="UTF-8">

        <!-- IMPORTANT: INCLUDE LICENSE WITH ANY EMBEDDED FONTS -->
    </head>
    <body>
        <!-- INTRO SEQUENCE -->
        <!-- students of the craft! try not to put 5 minute cutscenes in your website... -->
        <div id="intro">
            <div id="left">
                <!-- should be 41x41, and need shadows -->
                <div id="guava" class="shadow">
                    <div>
                        <img src="images/guava/guava_sleep.gif" onclick="start()" draggable="false"/>
                    </div>
                </div>
                <img id="sign" src="images/sign.png" draggable="false"/>
                <img id="sign2" src="images/sign2.png" draggable="false"/>
            </div>
            <div id="center" class="container">
                <h2 id="text"></h2>
                <h2 id="indicator"></h2>
                <div id="loading" style="display: none">
                    <h2>loading</h2>
                </div>
            </div>
            <div id="right">
                <img src="images/kiwidesk.gif" draggable="false"/>
                <h2>(Kiwi's desk)</h2>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div id="page">
            <div id="rainbowcontainer">
                <div id="rainbow"></div>
            </div>
            <img id="kiwi" src="images/kiwi/kiwi_1.gif" draggable="false"/>
            <img id="guava2" src="images/guava/guava_0.gif" draggable="false"/>
            <div id="sidebar">
                <!-- <div id="grid"><div></div></div> -->
                <h1 id="title">kiwi<br/>&nbsp;.rocks</h1>
                <!-- i seem to have forgotten about the "nav" element -->
                <div id="nav">
                    <h2 id="about" class="navitem">about</h2>
                    <h2 id="projects" class="navitem">projects</h2>
                    <h2 id="scripts" class="navitem">scripts</h2>
                    <h2 id="blog" class="navitem">blog</h2>
                    <h2 id="contact" class="navitem">contact</h2>
                </div>
                <p id="copyright">(c) 2026 Kiwi. No rights reserved.</p>
            </div>
            <div id="main">
                <!-- <div id="arrow">>></div> -->
                <!-- <div id="arrow2">>></div> -->
                <!-- <img id="hexagon" src="images/hexagon.png" draggable="false"/> -->

                <!-- fun scenes with kiwi & guava! -->
                <div class="skit scene">
                    <img id="kiwi_guava" src="images/kiwi_guava.gif" draggable="false"/>
                </div>

                <div class="skit scene perspective">
                    <div id="guava_test" class="shadow">
                        <div>
                            <!-- TODO: fix desync between gif playback and css animation sometimes -->
                            <!-- <img src="images/guava/guava_15.gif" draggable="false"/> -->
                             <img src="images/guava/guava_4.gif" draggable="false"/>
                        </div>
                        <!-- text goes here -->
                    </div>
                    <div id="kiwi_test" class="shadow">
                        <div>
                            <!-- TODO: kiwi doesn't blink. -->
                            <img src="images/kiwi/kiwi_1.png" draggable="false"/>
                        </div>
                        <!-- text goes here -->
                    </div>
                </div>

                <div class="skit scene">
                    <div id="guava_test2" class="shadow">
                        <div>
                            <!-- TODO: fix desync between gif playback and css animation sometimes -->
                            <!-- <img src="images/guava/guava_15.gif" draggable="false"/> -->
                             <img src="images/guava/guava_9.gif" draggable="false"/>
                        </div>
                        <!-- text goes here -->
                    </div>
                    <div id="kiwi_test2" class="shadow">
                        <div>
                            <img src="images/kiwi/kiwi_2.png" draggable="false"/>
                        </div>
                        <!-- text goes here -->
                    </div>
                    <img id="crawler" src="images/crawler.gif" draggable="false"/>
                </div>

                <div id="projectsscene" class="scene">
                    <div id="terminal">
                    </div>
                    <div id="laptopcontainer">
                        <div id="laptop">
                            <div id="keyboard"></div>
                            <div id="screen"></div>
                            <div id="screenback"></div>
                        </div>
                    </div>
                </div>

                <div id="contactscene" class="scene">
                    <div id="plane" class="shadow">
                        <div>
                             <img src="images/plane.gif" draggable="false"/>
                        </div>
                    </div>
                    <form id="contactform">
                        <input type="text" placeholder="name"/>
                        <input type="email" placeholder="email"/>
                        <textarea type="text" placeholder="message"></textarea>
                    </form>
                    <div id="connect">
                        <!-- <h2 id="send">>> send</h2> -->
                    </div>
                </div>

                <img id="switch" onclick="toggle_mode()" src="images/switch_on.png"/>
            </div>

            <!-- kiwi can walk through her bio and resume -->
            <h2 id="text2" class="text"></h2>
            <h2 id="text3" class="text"></h2>
        </div>
    </body>
</html>
